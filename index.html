<!DOCTYPE html>
<html>
<head>
    <title>Student Attendance - Diploma IT</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
        }

        .container {
            width: 350px;
            margin: auto;
            background: white;
            padding: 20px;
            margin-top: 50px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input, select, button {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Diploma IT Attendance</h2>

    <input type="text" id="name" placeholder="Enter Your Name" required>

    <input type="text" id="reg" placeholder="Reg No (02.0001.01.03.2026)" required>

    <select id="type">
        <option value="in">Sign In</option>
        <option value="out">Sign Out</option>
    </select>

    <button onclick="saveData()">Submit</button>
</div>

<script>
function saveData() {
    let name = document.getElementById("name").value;
    let reg = document.getElementById("reg").value;
    let type = document.getElementById("type").value;

    if(name === "" || reg === ""){
        alert("Fill all fields!");
        return;
    }

    let now = new Date();
    let date = now.toLocaleDateString();
    let time = now.toLocaleTimeString();

    let students = JSON.parse(localStorage.getItem("students")) || [];

    let found = students.find(s => s.reg === reg);

    if(type === "in"){
        if(found){
            found.signIn = time;
        } else {
            students.push({
                name: name,
                reg: reg,
                signIn: time,
                signOut: ""
            });
        }
    }

    if(type === "out"){
        if(found){
            found.signOut = time;
        } else {
            alert("You must Sign In first!");
            return;
        }
    }

    localStorage.setItem("students", JSON.stringify(students));

    alert("Recorded Successfully!");

    document.getElementById("name").value = "";
    document.getElementById("reg").value = "";
}
</script>

</body>
</html>
<!DOCTYPE html>
<html>
<head>
    <title>Admin Attendance Table</title>
    <style>
        body {
            font-family: Arial;
            background: #eef;
            text-align: center;
        }

        table {
            width: 95%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid black;
        }

        th {
            background: #333;
            color: white;
        }

        h2 {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h2 id="date"></h2>

<table>
    <thead>
        <tr>
            <th>No</th>
            <th>Name</th>
            <th>Reg Number</th>
            <th>Sign In</th>
            <th>Sign Out</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
function loadData(){
    let students = JSON.parse(localStorage.getItem("students")) || [];

    let table = document.getElementById("tableBody");
    table.innerHTML = "";

    students.forEach((s, index) => {
        let row = `
        <tr>
            <td>${index + 1}</td>
            <td>${s.name}</td>
            <td>${s.reg}</td>
            <td>${s.signIn || "-"}</td>
            <td>${s.signOut || "-"}</td>
        </tr>
        `;
        table.innerHTML += row;
    });

    let today = new Date();
    document.getElementById("date").innerText =
        "Attendance Date: " + today.toDateString();
}

loadData();
</script>

</body>
  </html>
