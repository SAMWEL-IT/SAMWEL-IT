<!DOCTYPE html>
<html>
<head>
    <title>Student Attendance - Diploma IT</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
        }

        .container {
            width: 350px;
            margin: auto;
            background: white;
            padding: 20px;
            margin-top: 50px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input, select, button {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Diploma IT Attendance</h2>

    <input type="text" id="name" placeholder="Enter Your Name" required>

    <input type="text" id="reg" placeholder="Reg No (02.0001.01.03.2026)" required>

    <select id="type">
        <option value="in">Sign In</option>
        <option value="out">Sign Out</option>
    </select>

    <button onclick="saveData()">Submit</button>
</div>

<script>
function saveData() {
    let name = document.getElementById("name").value;
    let reg = document.getElementById("reg").value;
    let type = document.getElementById("type").value;

    if(name === "" || reg === ""){
        alert("Fill all fields!");
        return;
    }

    let now = new Date();
    let date = now.toLocaleDateString();
    let time = now.toLocaleTimeString();

    let students = JSON.parse(localStorage.getItem("students")) || [];

    let found = students.find(s => s.reg === reg);

    if(type === "in"){
        if(found){
            found.signIn = time;
        } else {
            students.push({
                name: name,
                reg: reg,
                signIn: time,
                signOut: ""
            });
        }
    }

    if(type === "out"){
        if(found){
            found.signOut = time;
        } else {
            alert("You must Sign In first!");
            return;
        }
    }

    localStorage.setItem("students", JSON.stringify(students));

    alert("Recorded Successfully!");

    document.getElementById("name").value = "";
    document.getElementById("reg").value = "";
}
</script>

</body>
</html>
