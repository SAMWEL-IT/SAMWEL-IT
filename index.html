<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Smart Student Portal | Advanced System</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome (icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-wrapper" id="app">
    <!-- SIDEBAR / DASHBOARD (for student) - initially hidden -->
    <aside class="student-sidebar" id="studentSidebar">
        <div class="sidebar-header">
            <h3>Student Panel</h3>
            <button id="closeSidebarBtn"><i class="fas fa-times"></i></button>
        </div>
        <nav class="sidebar-nav">
            <button class="side-nav-btn active" data-student-nav="home"><i class="fas fa-home"></i> Home</button>
            <button class="side-nav-btn" data-student-nav="profile"><i class="fas fa-user-circle"></i> Profile Details</button>
            <button class="side-nav-btn" data-student-nav="account"><i class="fas fa-shield-alt"></i> Account Status</button>
            <button class="side-nav-btn" data-student-nav="results"><i class="fas fa-chart-line"></i> Semester Results</button>
            <button class="side-nav-btn" data-student-nav="payments"><i class="fas fa-credit-card"></i> Financial Payments</button>
            <button class="side-nav-btn logout-btn" id="studentLogoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- Top Bar for student dashboard (3 lines menu) -->
        <div class="top-bar" id="topBar">
            <button id="menuToggleBtn" class="menu-toggle"><i class="fas fa-bars"></i></button>
            <h2 id="pageTitle">Student Management System</h2>
            <div class="top-right"></div>
        </div>

        <!-- Dynamic pages container -->
        <div id="pageContainer" class="page-container">
            <!-- Homepage content will load here -->
        </div>

        <!-- FOOTER with social media -->
        <footer class="main-footer">
            <div class="footer-social">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-whatsapp"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
            </div>
            <p>&copy; 2025 Smart Portal | All rights reserved | Innovation Hub</p>
        </footer>
    </main>
</div>

<script src="script4.js"></script>
</body>
</html>
