<!DOCTYPE html>
<html>
<head>
    <title>Admin Attendance Table</title>
    <style>
        body {
            font-family: Arial;
            background: #eef;
            text-align: center;
        }

        table {
            width: 95%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid black;
        }

        th {
            background: #333;
            color: white;
        }

        h2 {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h2 id="date"></h2>

<table>
    <thead>
        <tr>
            <th>No</th>
            <th>Name</th>
            <th>Reg Number</th>
            <th>Sign In</th>
            <th>Sign Out</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
function loadData(){
    let students = JSON.parse(localStorage.getItem("students")) || [];

    let table = document.getElementById("tableBody");
    table.innerHTML = "";

    students.forEach((s, index) => {
        let row = `
        <tr>
            <td>${index + 1}</td>
            <td>${s.name}</td>
            <td>${s.reg}</td>
            <td>${s.signIn || "-"}</td>
            <td>${s.signOut || "-"}</td>
        </tr>
        `;
        table.innerHTML += row;
    });

    let today = new Date();
    document.getElementById("date").innerText =
        "Attendance Date: " + today.toDateString();
}

loadData();
</script>

</body>
  </html>
